name: Deploy Portfolio

on:
  push:
    branches: [ "main" ]  # Change to "master" if your default branch is master
  pull_request:
    branches: [ "main" ]

# Auto-cancel any previous runs that are still in progress for this branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10  # Automatically kills the job if it hangs past 10 minutes

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build
        timeout-minutes: 5  # Step timeout: fails specifically if npm run build hangs
        

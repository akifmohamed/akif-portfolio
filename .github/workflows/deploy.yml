name: Deploy Portfolio

on:
  push:
    branches: [ "main" ]

# Cancel in-progress runs to prevent deployment locks
concurrency:
  group: "pages"
  cancel-in-progress: true

# Grant GitHub Pages permission to deploy the artifact
permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build
        env:
          CI: false

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Change path to match your framework's build output:
          # Vite / Vue / Svelte: ./dist
          # Create React App:   ./build
          # Next.js static export: ./out
          path: './dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        
